# Isolated Locust driver check — NO published ports (endpoints are private to the
# internal network / container loopback). db is reachable only inside attlt_net.
name: attlt-driver-check
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: core_school_attendance_load_test
      POSTGRES_USER: attlt_driver
      POSTGRES_PASSWORD: attlt_driver_local
    networks: [attlt_net]
    tmpfs: ["/var/lib/postgresql/data"]      # ephemeral; nothing persisted
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attlt_driver -d core_school_attendance_load_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  runner:
    build:
      context: .
      dockerfile: Dockerfile.driver
    depends_on:
      db: {condition: service_healthy}
    environment:
      ATTLT_PG_HOST: db
      ATTLT_PG_PORT: "5432"
      ATTLT_PG_USER: attlt_driver
      ATTLT_PG_PASSWORD: attlt_driver_local
      ATTLT_TARGET_HOST: 127.0.0.1
    volumes:
      - type: bind
        source: ${ATTLT_TOOLING_DIR:?set ATTLT_TOOLING_DIR to the attendance_probe dir}
        target: /tooling
        read_only: true
      - type: bind
        source: ${ATTLT_APP_SRC_DIR:?set ATTLT_APP_SRC_DIR to <experiment root>/app_src}
        target: /app_src_ro
        read_only: true
      - type: bind
        source: ./out
        target: /out
    networks: [attlt_net]
networks:
  attlt_net:
    internal: true          # no external connectivity; endpoints are private
